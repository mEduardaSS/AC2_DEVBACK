                                                                                                                                                                                                                            <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Controle de Projetos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            Controle<span>+</span>
        </a>

        <span class="navbar-text text-white-50">
            Sistema de Projetos
        </span>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">

        <div>
            <p class="eyebrow mb-1">PAINEL DE CONTROLE</p>
            <h1 class="h2 fw-bold mb-1">Projetos</h1>
            <p class="text-secondary mb-0">
                Cadastre e acompanhe seus projetos.
            </p>
        </div>

        <button
            class="btn btn-primary px-4"
            data-bs-toggle="modal"
            data-bs-target="#modalProjeto">
            + Novo projeto
        </button>
    </div>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <section class="row g-3 mb-4">

        <div class="col-sm-6 col-lg-4">
            <div class="stat-card">
                <span class="text-secondary small">
                    Projetos cadastrados
                </span>

                <div id="totalProjetos" class="stat-number">0</div>
            </div>
        </div>

    </section>

    <section class="panel">

        <div class="d-flex flex-wrap justify-content-between
                    align-items-center gap-3 mb-3">

            <h2 class="h5 fw-bold mb-0">Lista de projetos</h2>

            <input
                id="filtro"
                class="form-control search-input"
                type="search"
                placeholder="Buscar por descrição..."
                aria-label="Buscar projeto">
        </div>

        <div class="table-responsive">
            <table class="table align-middle">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaProjetos">
                    <tr>
                        <td colspan="5"
                            class="text-center text-secondary py-4">
                            Carregando projetos...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

        <p id="vazio" class="text-secondary small d-none">
            Nenhum projeto encontrado.
        </p>

    </section>
</main>

<div
    class="modal fade"
    id="modalProjeto"
    tabindex="-1"
    aria-labelledby="modalProjetoLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <form id="formProjeto">

                <div class="modal-header">
                    <div>
                        <p class="eyebrow mb-1">NOVO CADASTRO</p>

                        <h2
                            class="modal-title fs-5 fw-bold"
                            id="modalProjetoLabel">
                            Adicionar projeto
                        </h2>
                    </div>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label for="descricao" class="form-label">
                            Descrição do projeto
                        </label>

                        <input
                            id="descricao"
                            name="descricao"
                            class="form-control"
                            maxlength="200"
                            required
                            placeholder="Ex.: Implantação de sistema">
                    </div>

                    <div class="row g-3">

                        <div class="col-sm-6">
                            <label for="dataInicio" class="form-label">
                                Data de início
                            </label>

                            <input
                                id="dataInicio"
                                name="dataInicio"
                                type="date"
                                class="form-control"
                                required>
                        </div>

                        <div class="col-sm-6">
                            <label for="dataFim" class="form-label">
                                Data de fim
                            </label>

                            <input
                                id="dataFim"
                                name="dataFim"
                                type="date"
                                class="form-control"
                                required>
                        </div>

                    </div>

                    <div
                        id="erroFormulario"
                        class="text-danger small mt-3 d-none">
                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        id="salvarBtn"
                        class="btn btn-primary">
                        Salvar projeto
                    </button>

                </div>

            </form>
        </div>
    </div>
</div>

<!-- Modal de detalhes -->
<div
    class="modal fade"
    id="detalheModal"
    tabindex="-1"
    aria-labelledby="detalheModalLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h2
                    class="modal-title fs-5 fw-bold"
                    id="detalheModalLabel">
                    Detalhes do projeto
                </h2>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Fechar">
                </button>
            </div>

            <div id="detalheConteudo" class="modal-body"></div>

        </div>
    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/js/app.js"></script>

</body>
</html>
